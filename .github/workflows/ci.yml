name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: "dev-secret"
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BUDGET_DATABASE_URL: "postgresql+psycopg://budget:dev-secret@localhost:5432/budget_test"
      BUDGET_JWT_SECRET: dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify models match migrations
        run: alembic check
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test money conversion
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check + build
        run: npm run build
